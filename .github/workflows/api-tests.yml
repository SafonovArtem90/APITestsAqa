name: API Tests

on:
  push:
    branches: [ master, refactoring ]
  pull_request:
    branches: [ master, refactoring ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f Dockerfile.test -t aqa-tests .

      - name: Run API tests in Docker
        run: |
          mkdir -p allure-results
          docker run --rm -v "${{ github.workspace }}/allure-results:/app/api-tests/target/allure-results" aqa-tests

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
