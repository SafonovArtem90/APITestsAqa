name: API Tests

on:
  push:
    branches: [ master, refactoring ]
  pull_request:
    branches: [ master, refactoring ]
  workflow_dispatch:

env:
  SERVICE_BASE_URL: http://localhost:8080
  SERVICE_API_KEY: ${{ secrets.SERVICE_API_KEY }}
  SECRET: ${{ secrets.SECRET }}
  MOCK_SERVICE_PORT: "8888"
  TOKEN_LENGTH: "32"
  TOKEN_REGEX: ^[0-9A-F]{32}$
  TEST_RETRY_COUNT: "1"

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build test image
        run: docker build -f Dockerfile.test -t aqa-tests .

      - name: Run API tests in Docker
        run: |
          mkdir -p allure-results
          docker run --rm \
            -e SERVICE_BASE_URL="${SERVICE_BASE_URL}" \
            -e SERVICE_API_KEY="${SERVICE_API_KEY}" \
            -e SECRET="${SECRET}" \
            -e MOCK_SERVICE_PORT="${MOCK_SERVICE_PORT}" \
            -e TOKEN_LENGTH="${TOKEN_LENGTH}" \
            -e TOKEN_REGEX="${TOKEN_REGEX}" \
            -e TEST_RETRY_COUNT="${TEST_RETRY_COUNT}" \
            -v "${{ github.workspace }}/allure-results:/app/api-tests/target/allure-results" \
            aqa-tests

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results

  allure-report:
    needs: test
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Allure results
        uses: actions/download-artifact@v5
        with:
          name: allure-results
          path: allure-results

      - name: Restore Allure history from gh-pages
        run: |
          git config --global user.email "ci@actions"
          git config --global user.name "ci"
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch found, restoring history..."
            git fetch origin gh-pages
            git worktree add /tmp/allure-gh-pages origin/gh-pages
            if [ -d /tmp/allure-gh-pages/history ]; then
              mkdir -p allure-results/history
              cp -r /tmp/allure-gh-pages/history/* allure-results/history/
            fi
          else
            echo "No gh-pages branch yet, history will start fresh."
          fi

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages

      - name: Publish Allure link to summary
        run: |
          echo "## :1234: API Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Allure report: [Open](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY
          echo "Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
